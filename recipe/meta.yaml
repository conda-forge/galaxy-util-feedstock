{% set version = "26.0.1" %}
{% set sha256 = "f20049bf8f95bfa64b4aaa14d738f42aa89ec1328a31c78d6fb95f08fd9114f2" %}

package:
  name: galaxy-util
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/g/galaxy-util/galaxy_util-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - bleach
    - boltons
    - docutils
    - importlib_resources >=5.10.0
    - packaging
    - pyparsing >=3.0.0
    - python >={{ python_min }}
    - pyyaml
    - requests
    - typing_extensions
    - zipstream-new
    # extras_require:
    #- dictobj
    - ct3
    - fissix
    - future >=1.0.0
  run_constrained:
    # Disallow installation of conflicting older package.
    - galaxy-lib <0a0

test:
  requires:
    - python {{ python_min }}
  imports:
    - galaxy
    - galaxy.exceptions
    - galaxy.util
    - galaxy.util.custom_logging
    - galaxy.util.path
    - galaxy.util.template
    - galaxy.util.tool_shed

about:
  home: https://galaxyproject.org
  license: MIT
  license_file: LICENSE
  summary: Galaxy Generic Utilities
  doc_url: https://docs.galaxyproject.org
  dev_url: https://github.com/galaxyproject/galaxy

extra:
  recipe-maintainers:
    - nsoranzo
    - bgruening
